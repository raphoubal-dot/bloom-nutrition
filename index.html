const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(str,n)=>{const d=new Date(`${str}T12:00:00`);d.setDate(d.getDate()+n);return localDate(d)};

function searchWorker(){const raw=String(db.settings?.searchWorkerUrl||DEFAULT_SEARCH_WORKER).trim().replace(/\/+$/,'');return /^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(raw)?raw:''}
async function proxyFoods(q,mode='search',signal){const base=searchWorker();if(!base)throw Error('Configure le service de recherche dans les réglages.');const endpoint=new URL(base+'/search');endpoint.searchParams.set('q',q);endpoint.searchParams.set('mode',mode);const resp=await fetch(endpoint.toString(),{signal,headers:{'Accept':'application/json'}});const json=await resp.json().catch(()=>({}));if(!resp.ok)throw Error(json.error||'Recherche indisponible ('+resp.status+')');if(!Array.isArray(json.products))throw Error('Réponse du service inattendue');return rankFoods(json.products.map(offProduct),q)}

function getRefEnergy(p){if(!p)return 0;const b=10*num(p.weight)+6.25*num(p.height)-5*num(p.age);if(p.formula==='male')return b+5;if(p.formula==='female')return b-161;return b-78}
function targets(p){if(!p)return {cal:0,protein:0,carbs:0,fat:0,maintenance:0};const maintenance=getRefEnergy(p)*num(p.activity,1.35);const factor=p.goal==='lose'?.87:p.goal==='gain'?1.10:1;const cal=Math.max(0,Math.round(maintenance*factor/10)*10);const protein=Math.round(num(p.weight)*(p.goal==='lose'?1.6:1.4));const fat=Math.round(num(p.weight)*.8);const carbs=Math.max(0,Math.round((cal-protein*4-fat*9)/4));return {cal,protein,carbs,fat,maintenance:Math.round(maintenance)}}
const valKeys=['cal','protein','carbs','fat','fiber','sugars'];
function cleanNutrition(obj){const r={};for(const k of valKeys)r[k]=Math.max(0,num(obj?.[k]));return r}
function nutritionFor(item,grams){const per=cleanNutrition(item);const factor=num(grams)/100;return Object.fromEntries(valKeys.map(k=>[k,rnd(per[k]*factor,1)]))}
function total(entries){return entries.reduce((acc,item)=>{const n=nutritionFor(item,item.grams);for(const k of valKeys)acc[k]+=n[k];return acc},cleanNutrition({}))}
function dailyEntries(){return db.entries.filter(e=>e.date===chosenDate)}
function calcRecipe(rec){const grams=rec.cookedWeight>0?rec.cookedWeight:rec.ingredients.reduce((x,i)=>x+num(i.grams),0);const tot=total(rec.ingredients);const per={};for(const k of valKeys)per[k]=grams>0?rnd(tot[k]*100/grams,3):0;return {...per,name:rec.name,brand:'Recette maison',defaultGrams:rec.cookedWeight>0?rec.cookedWeight/rec.servings:grams/rec.servings};}

function catSVG(cls=''){return `<img class="bloomie ${cls}" src="${BLOOMIE_ART}" alt="Bloomie, le petit chat noir parmi les fleurs">`}
function bloomGarden(){return `<div class="bloom-garden" aria-label="Bloomie parmi les fleurs">
<svg class="garden-stem garden-left" viewBox="0 0 110 280" aria-hidden="true"><g fill="none" stroke="#789876" stroke-width="3.2" stroke-linecap="round"><path d="M22 286 C 62 214 15 151 55 44"/><path d="M40 198 Q 8 165 6 143M40 198 Q 77 180 77 149M50 117 Q 20 100 18 79M52 90 Q 78 77 87 53"/></g><g fill="#91b28a"><ellipse cx="20" cy="157" rx="13" ry="23" transform="rotate(-38 20 157)"/><ellipse cx="71" cy="166" rx="12" ry="22" transform="rotate(43 71 166)"/><ellipse cx="20" cy="88" rx="10" ry="19" transform="rotate(-35 20 88)"/><ellipse cx="83" cy="59" rx="10" ry="18" transform="rotate(32 83 59)"/></g><g transform="translate(49 40)"><circle r="11" fill="#f6ca87"/><g fill="#f4aa9f"><ellipse cy="-23" ry="17" rx="12"/><ellipse cy="23" ry="17" rx="12"/><ellipse cx="23" ry="12" rx="17"/><ellipse cx="-23" ry="12" rx="17"/></g><circle r="9" fill="#f5cc7b"/></g></svg>
<div class="garden-glow"></div>${catSVG('welcome')}
<svg class="garden-stem garden-right" viewBox="0 0 110 280" aria-hidden="true"><g fill="none" stroke="#789876" stroke-width="3.2" stroke-linecap="round"><path d="M84 286 C 44 214 95 151 55 44"/><path d="M65 198 Q 99 165 101 143M65 198 Q 29 180 29 149M54 117 Q 88 100 90 79M53 90 Q 27 77 20 53"/></g><g fill="#91b28a"><ellipse cx="90" cy="157" rx="13" ry="23" transform="rotate(38 90 157)"/><ellipse cx="34" cy="166" rx="12" ry="22" transform="rotate(-43 34 166)"/><ellipse cx="90" cy="88" rx="10" ry="19" transform="rotate(35 90 88)"/><ellipse cx="26" cy="59" rx="10" ry="18" transform="rotate(-32 26 59)"/></g><g transform="translate(58 40)"><g fill="#f9d6a3"><ellipse cy="-23" ry="17" rx="12"/><ellipse cy="23" ry="17" rx="12"/><ellipse cx="23" ry="12" rx="17"/><ellipse cx="-23" ry="12" rx="17"/></g><circle r="9" fill="#efb07a"/></g></svg>
<span class="garden-flower flower-a">✿</span><span class="garden-flower flower-b">✽</span><span class="garden-flower flower-c">✦</span></div>`}
function header(title,subtitle=''){return `<header class="topbar"><div><div class="eyebrow">Bloom · petits pas, grands changements</div><h1 class="serif" style="margin-top:7px">${esc(title)}</h1>${subtitle?`<p class="muted" style="margin-top:5px;font-size:.86rem">${esc(subtitle)}</p>`:''}</div><span aria-hidden="true" class="flower">🌷</span></header>`}
function tabs(){return `<nav class="tabs" aria-label="Navigation principale">${[['home','⌂','Accueil'],['journal','▤','Journal'],['add','+','Ajouter'],['recipes','♡','Recettes'],['progress','▥','Progrès']].map(([id,ico,label])=>`<button type="button" class="tab ${view===id?'active':''} ${id==='add'?'add':''}" data-go="${id}" aria-label="${label}" ${view===id?'aria-current="page"':''}><span class="ico">${ico}</span>${id==='add'?'':`<span>${label}</span>`}</button>`).join('')}</nav>`}
function page(content,tabsVisible=true){return `<main class="app"><div class="page ${tabsVisible?'with-tabs':'onboarding-page'}">${content}</div>${tabsVisible?tabs():''}</main>${renderModal()}`}
function dayNav(){return `<div class="date-strip"><button data-action="date-prev" aria-label="Jour précédent">‹</button><input class="input" style="border:0;min-height:34px;padding:0" type="date" id="day" value="${chosenDate}" aria-label="Choisir une date"><button data-action="date-next" aria-label="Jour suivant">›</button><button class="btn tiny secondary" data-action="today">Auj.</button></div><div class="center small" style="margin:-10px 0 17px;text-transform:capitalize">${esc(humanDate(chosenDate))}</div>`}
function mealCards(){const entries=dailyEntries();return `<div class="stack">${TYPES.map(t=>{const arr=entries.filter(e=>e.type===t.id), sums=total(arr);return `<section class="meal"><div class="meal-heading"><strong>${t.icon} ${t.name}</strong><button class="btn tiny secondary" data-action="add-to-meal" data-type="${t.id}">+ Ajouter</button></div>${arr.length?arr.map(e=>`<div class="meal-item"><div class="grow"><b>${esc(e.name)}</b><small>${esc(e.brand||'')} · ${rnd(e.grams,1)} ${esc(e.unit||'g')} · ${Math.round(nutritionFor(e,e.grams).cal)} kcal</small></div><button class="round" aria-label="Modifier ${esc(e.name)}" data-action="edit-entry" data-id="${esc(e.id)}">✎</button></div>`).join(''):`<div class="small">Aucun aliment ajouté.</div>`}${arr.length?`<div class="status-row small"><span>${arr.length} aliment${arr.length>1?'s':''}</span><strong>${Math.round(sums.cal)} kcal</strong></div>`:''}</section>`}).join('')}</div>`}
function macrosGrid(n,t){return `<div class="macros">${[['protein','Protéines','#f3b0ac'],['carbs','Glucides','#c0a9df'],['fat','Lipides','#9fbca5']].map(([k,label,color])=>`<div class="macro"><div class="dot" style="background:${color}"></div><b>${Math.round(n[k])} <small>/ ${t[k]} g</small></b><small>${label}</small></div>`).join('')}</div>`}
function home(){const p=db.profile,t=targets(p),n=total(dailyEntries());return page(`<div class="row between mb18"><div><div class="eyebrow">BONJOUR ${esc(p.firstName||'!')} 🌞</div><h1 class="serif" style="margin-top:7px">Une belle journée<br>pour toi 🌿</h1></div><button class="btn secondary tiny" data-action="settings" aria-label="Réglages">⚙</button></div><div class="hero mb18"><div class="row between top"><div class="grow"><span class="pill pink">🌸 Ton équilibre du jour</span><div style="font-weight:900;font-size:2.2rem;margin-top:13px" class="number">${Math.round(n.cal)} <span style="font-size:.95rem;color:#748276;font-weight:500">/ ${t.cal} kcal</span></div><p class="small" style="margin:5px 0 10px">${Math.max(0,Math.round(t.cal-n.cal))} kcal jusqu'à ton repère</p></div><div class="home-cat-frame">${catSVG('compact')}</div></div><div class="bar" aria-label="${Math.round(n.cal/Math.max(1,t.cal)*100)}% de ton repère"><div style="width:${Math.min(100,Math.round(n.cal/Math.max(1,t.cal)*100))}%"></div></div><p class="help" style="margin:8px 0 0">Bloomie te rappelle : chaque journée est différente. ♡</p></div><div class="card mb18">${macrosGrid(n,t)}</div>${dayNav()}<div class="row between mb12"><h2 class="serif">Tes repas</h2><button class="btn tiny ghost" data-go="journal">Voir le journal →</button></div>${mealCards()}<div class="card sage mt12"><div class="row between"><div><strong>👟 Tes pas</strong><p class="small">Saisie manuelle, pour le moment</p></div><button class="btn tiny secondary" data-action="steps">${num(db.steps[chosenDate]).toLocaleString('fr-FR')} pas ✎</button></div></div><p class="footer-note">Nutrition en douceur · Avec Bloomie 🐈‍⬛</p>`)}
function journal(){const n=total(dailyEntries());return page(`${header('Ton journal','Tes repas, à ton rythme.')}${dayNav()}<div class="card sage mb18"><div class="status-row"><strong>Total de la journée</strong><span class="pill">${Math.round(n.cal)} kcal</span></div><div style="height:11px"></div><div class="small">${Math.round(n.protein)} g protéines · ${Math.round(n.carbs)} g glucides · ${Math.round(n.fat)} g lipides</div></div>${mealCards()}<div class="card flat mt12"><strong>⏭️ Préparer un autre jour</strong><p class="small" style="margin:6px 0 13px">Tu peux ajouter librement des repas à demain ou copier ceux d'une autre date.</p><button class="btn secondary full" data-action="copy-day">Copier cette journée vers une autre date</button></div>`)}
function add(){return page(`${header('Ajouter un aliment','Plusieurs chemins, une seule habitude facile.')}
<div class="stack"><button class="choice" data-action="show-scan"><span class="emoji">📷</span><span class="grow"><strong>Scanner un code-barres</strong><small>Caméra iPhone, puis recherche du produit</small></span><span>›</span></button><button class="choice" data-action="show-search"><span class="emoji">🔎</span><span class="grow"><strong>Rechercher un produit</strong><small>Par nom ou code-barres dans Open Food Facts</small></span><span>›</span></button><button class="choice" data-action="show-photo"><span class="emoji">🖼️</span><span class="grow"><strong>Importer une capture d'écran</strong><small>Étiquette, menu ou fiche nutritionnelle</small></span><span>›</span></button><button class="choice" data-action="new-food"><span class="emoji">✏️</span><span class="grow"><strong>Créer un aliment</strong><small>Saisir les valeurs nutritionnelles à la main</small></span><span>›</span></button><button class="choice" data-action="my-foods"><span class="emoji">❤️</span><span class="grow"><strong>Mes aliments enregistrés</strong><small>${db.foods.length} aliment(s) dans ta bibliothèque</small></span><span>›</span></button></div>${flowers()}<div class="note">Pour les recettes maison, passe par l'onglet <strong>Recettes</strong>. Aucun repas ne quitte ton iPhone : seule une recherche volontaire interroge Open Food Facts.</div>`)}
function recipes(){return page(`${header('Mes recettes','Des plats maison à enregistrer en un clin d’œil.') }<div class="hero mb18"><div class="row between"><div><h3>Ta cuisine, tes habitudes</h3><p class="small" style="margin-top:6px">Une recette, plusieurs portions, et tu peux la réutiliser.</p></div><span style="font-size:3rem">🥣</span></div><button class="btn full" style="margin-top:13px" data-action="new-recipe">+ Créer une recette</button></div>${db.recipes.length?`<div class="stack">${db.recipes.map(r=>{const f=calcRecipe(r),g=f.defaultGrams;return `<div class="card"><div class="row between mb8"><strong>${esc(r.name)}</strong><span class="pill pink">${r.servings} portion${r.servings>1?'s':''}</span></div><p class="small">${Math.round(f.cal*g/100)} kcal par portion · ${r.ingredients.length} ingrédients</p><div class="two-actions mt12"><button class="btn secondary tiny" data-action="use-recipe" data-id="${esc(r.id)}">Ajouter au journal</button><button class="btn ghost tiny" data-action="edit-recipe" data-id="${esc(r.id)}">Modifier</button></div></div>`}).join('')}</div>`:`<div class="empty">🌷 Ta bibliothèque de recettes est encore vide.<br>Commence par créer tes aliments, puis compose ton premier plat.</div>`}`)}
function progress(){const t=targets(db.profile),all=db.weights.slice().sort((a,b)=>b.date.localeCompare(a.date));return page(`${header('Ta progression','Les tendances comptent plus qu’un seul chiffre.') }<div class="card sage mb18"><div class="row between"><div><div class="tinylabel">Ta dernière pesée</div><div style="font-size:2rem;font-weight:900;margin-top:7px">${all.length?rnd(all[0].weight,1)+' kg':rnd(db.profile.weight,1)+' kg'}</div><p class="small">${all.length?humanDate(all[0].date):'Poids de départ'}</p></div><span style="font-size:3rem">🌱</span></div><button class="btn secondary full mt12" data-action="weight">+ Ajouter une pesée</button></div><div class="card mb18"><div class="row between mb12"><strong>Historique du poids</strong><span class="pill">${all.length} mesure(s)</span></div>${all.length?all.slice(0,12).map(w=>`<div class="list-row"><span>${esc(humanDate(w.date))}</span><strong>${rnd(w.weight,1)} kg</strong></div>`).join(''):`<div class="empty">Les courbes arriveront au fil de tes pesées. 🌸</div>`}</div><div class="card lilac mb18"><strong>🎯 Tes repères nutritionnels</strong><div class="grid2 mt12"><div class="statbox"><strong>${t.cal}</strong><small>kcal / jour</small></div><div class="statbox"><strong>${t.protein} g</strong><small>Protéines / jour</small></div></div><p class="help" style="margin-top:11px">Ces objectifs sont des estimations personnalisables, pas des obligations.</p></div><button class="btn secondary full" data-action="settings">⚙ Modifier mes objectifs et paramètres</button>`)}
function onboard(){const step=onboardingStep,p=draftProfile,t=targets(p);let body='';if(step===0){body=`<section class="welcome-hero"><span class="welcome-orbit" aria-hidden="true">✧</span><div class="brand brand-floral">Bloom<span>☀</span></div><h1 class="serif welcome-title">Une meilleure relation<br>avec la nourriture,<br>jour après jour.</h1>${bloomGarden()}<p class="welcome-caption">Avec Bloomie, on avance à ton rythme. <span aria-hidden="true">♡</span></p></section><div class="welcome-action"><button class="btn full" data-action="onboard-next">Commencer →</button><p class="help center">Petits pas, grands changements 🌷</p></div>`}else{const steps=['','Parlons un peu de toi','Quel est ton objectif ?','Ton activité physique','Contexte hormonal (optionnel)','Tes objectifs'];body=`<div class="row between ob-top"><button class="btn ghost tiny" data-action="onboard-back">← Retour</button><span class="eyebrow">${step}/5</span></div><div class="progress-steps">${[1,2,3,4,5].map(n=>`<div class="${n<=step?'on':''}"></div>`).join('')}</div><div class="onboard-heading"><span class="onboard-sprig" aria-hidden="true">🌿</span><h1 class="serif mb8">${steps[step]}</h1></div>`;
if(step===1)body+=`<p class="muted mb18">Quelques informations pour personnaliser ton expérience. 🌷</p><div class="card stack"><div class="field"><label for="ob-firstName">Prénom</label><input class="input" id="ob-firstName" data-profile="firstName" autocomplete="given-name" value="${esc(p.firstName)}" placeholder="Comment t'appelles-tu ?" maxlength="48"></div><div class="field"><label for="ob-age">Âge (années)</label><input class="input" id="ob-age" data-profile="age" type="number" min="18" max="110" value="${esc(p.age)}"></div><div class="form-grid"><div class="field"><label for="ob-height">Taille (cm)</label><input class="input" id="ob-height" data-profile="height" type="number" min="100" max="240" step="0.1" value="${esc(p.height)}"></div><div class="field"><label for="ob-weight">Poids (kg)</label><input class="input" id="ob-weight" data-profile="weight" type="number" min="25" max="400" step="0.1" value="${esc(p.weight)}"></div></div><div class="field"><label>Référence de calcul énergétique</label><select class="input" data-profile="formula"><option value="mid" ${p.formula==='mid'?'selected':''}>Intermédiaire (par défaut)</option><option value="female" ${p.formula==='female'?'selected':''}>Équation féminine</option><option value="male" ${p.formula==='male'?'selected':''}>Équation masculine</option></select><p class="help">Ces équations de départ sont imparfaites, particulièrement selon la composition corporelle et le contexte hormonal. Tu pourras ajuster les résultats.</p></div></div>`;
if(step===2)body+=`<p class="muted mb18">Il n'y a pas de mauvais choix, seulement le tien. ♡</p><div class="stack">${[['lose','🌱','Perdre du poids','À ton rythme, sans précipitation'],['maintain','🌼','Maintenir mon poids','Préserver mes habitudes'],['gain','💪','Prendre du poids','Accompagner ta progression']].map(([id,emoji,title,sub])=>`<button class="choice ${p.goal===id?'selected':''}" data-profile-choice="goal" data-value="${id}"><span class="emoji">${emoji}</span><span><strong>${title}</strong><small>${sub}</small></span></button>`).join('')}</div>`;
if(step===3)body+=`<p class="muted mb18">Une estimation de tes dépenses énergétiques selon ton rythme de vie.</p><div class="stack">${[['1.2','🪴','Peu actif','Peu de mouvement quotidien'],['1.35','🚶','Légèrement actif','Marche régulière et activité légère'],['1.5','🏃','Actif','Marche importante ou sport fréquent'],['1.7','🏋️','Très actif','Activité et entraînements soutenus']].map(([id,emoji,title,sub])=>`<button class="choice ${num(p.activity)===num(id)?'selected':''}" data-profile-choice="activity" data-value="${id}"><span class="emoji">${emoji}</span><span><strong>${title}</strong><small>${sub}</small></span></button>`).join('')}</div>`;
if(step===4)body+=`<p class="muted mb18">Cette information facultative aide à contextualiser les estimations. Aucune correction calorique automatique n'est appliquée sur cette seule base.</p><div class="stack">${[['none','🌿','Non',''],['testosterone','🌸','Oui, testostérone',''],['estrogen','🌷','Oui, œstrogènes',''],['other','✨','Autre situation',''],['skip','♡','Je préfère ne pas répondre','']].map(([id,emoji,title,sub])=>`<button class="choice ${p.hormones===id?'selected':''}" data-profile-choice="hormones" data-value="${id}"><span class="emoji">${emoji}</span><span><strong>${title}</strong></span></button>`).join('')}</div>`;
if(step===5)body+=`<p class="muted mb18">Une base pour commencer, que tu pourras modifier à tout moment.</p><div class="card sage center mb18"><span class="tinylabel">Repère énergétique quotidien</span><div style="font-size:2.5rem;font-weight:900;margin:12px 0">${t.cal} <span style="font-size:1rem">kcal</span></div><p class="small">Maintien estimé : ${t.maintenance} kcal</p></div><div class="card">${macrosGrid(t,t)}</div><p class="note mt12">🌸 Ce résultat est une estimation et non une prescription. Tu peux adapter tes objectifs dans les paramètres.</p>`;
body+=`<div class="onboard-friend"><div class="friend-art">${catSVG('step-cat')}</div><p>${step===5?'De belles habitudes t’attendent ! ♡':(['','Tout commence par toi. ♡','Chaque objectif compte. 🌼','Chaque mouvement compte. 🌿','À ton rythme, selon tes besoins. ♡'][step]||'Avec Bloomie. 🌸')}</p></div><div class="onboard-actions"><button class="btn full" data-action="onboard-next">${step===5?'Commencer avec Bloom 🌸':'Continuer →'}</button></div>`;}return page(`<div class="onboard-shell">${onboardingPreview?'<button class="preview-exit" data-action="preview-exit">✕ Quitter l’aperçu</button>':''}${body}</div>`,false)}
function render(){let content;if(!db.profile||onboardingPreview)content=onboard();else content=({home,journal,add,recipes,progress}[view]||home)();$('#app').innerHTML=content}
function field(name,label,value='',type='text',opts=''){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><input id="${esc(name)}" class="input" data-form="${esc(name)}" type="${type}" ${opts} value="${esc(value)}"></div>`}
function selects(name,label,opts,current){return `<div class="field"><label for="${esc(name)}">${esc(label)}</label><select class="input" id="${esc(name)}" data-form="${esc(name)}">${opts.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(current)?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`}
function modalWrap(title,inner){return `<div class="modal-bg" data-backdrop="1"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between mb18"><h2 class="serif">${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="Fermer">×</button></div>${inner}</section></div>`}
function renderModal(){if(!modal)return '';const f=modal.form||{};switch(modal.type){
case 'settings':{const p=db.profile,t=targets(p);return modalWrap('Ton profil 🌿',`<div class="stack"><div class="card sage"><strong>${esc(p.firstName||'Mon profil')}</strong><p class="small" style="margin:7px 0 0">${esc(p.age)} ans · ${esc(p.height)} cm · ${esc(p.weight)} kg</p><p class="small">${t.maintenance} kcal de maintien estimé</p></div>${field('firstName','Prénom',f.firstName)}<div class="form-grid">${field('age','Âge',f.age,'number','min="18" max="110"')}${field('weight','Poids de référence (kg)',f.weight,'number','min="25" max="400" step="0.1"')}</div>${field('height','Taille (cm)',f.height,'number','min="100" max="240" step="0.1"')}${selects('formula','Référence de calcul',[['mid','Intermédiaire'],['female','Équation féminine'],['male','Équation masculine']],f.formula)}${selects('goal','Objectif',[['lose','Perdre du poids'],['maintain','Maintien'],['gain','Prendre du poids']],f.goal)}${selects('activity','Activité',[['1.2','Peu actif'],['1.35','Légèrement actif'],['1.5','Actif'],['1.7','Très actif']],f.activity)}${selects('hormones','Contexte hormonal (facultatif)',[['none','Non'],['testosterone','Testostérone'],['estrogen','Œstrogènes'],['other','Autre'],['skip','Je préfère ne pas répondre']],f.hormones)}<p class="help">Les formules énergétiques sont des estimations imparfaites ; le contexte hormonal seul ne déclenche aucun coefficient automatique.</p><button class="btn full" data-action="save-settings">Enregistrer le profil</button><hr class="sep"><h3>Personnaliser les macros</h3><div class="form-grid">${field('targetCal','Calories / jour',f.targetCal,'number','min="1"')}${field('targetProtein','Protéines (g)',f.targetProtein,'number','min="0"')}</div><div class="form-grid">${field('targetCarbs','Glucides (g)',f.targetCarbs,'number','min="0"')}${field('targetFat','Lipides (g)',f.targetFat,'number','min="0"')}</div><button class="btn secondary full" data-action="save-targets">Enregistrer mes objectifs personnalisés</button><button class="btn ghost full" data-action="reset-targets">Revenir au calcul automatique</button><hr class="sep"><h3>Recherche Open Food Facts</h3><p class="help">Pour afficher les suggestions dès trois lettres sur Safari, Bloom peut utiliser une petite passerelle HTTPS. Seuls les termes recherchés lui sont transmis, jamais ton profil ni tes repas.</p><label class="label" for="search-worker-url">Adresse du service de recherche</label><input class="input" type="url" id="search-worker-url" value="${esc(db.settings?.searchWorkerUrl||DEFAULT_SEARCH_WORKER)}" placeholder="https://bloom-food-search.xxx.workers.dev" spellcheck="false"><div class="two-actions"><button class="btn secondary" data-action="connect-search-service">Enregistrer l’adresse</button><button class="btn ghost" data-action="check-search-service">Tester la connexion</button></div><p class="help" id="search-worker-status">${searchWorker()?'Service configuré. Tu peux vérifier sa connexion.':'Aucun service configuré. Les aliments personnels restent accessibles.'}</p><hr class="sep"><h3>Découvrir Bloom</h3><button class="btn secondary full" data-action="preview-onboarding">🌷 Revoir les écrans de bienvenue</button><p class="help">Aperçu sans modifier ton profil ni tes repas.</p><hr class="sep"><h3>Mes données</h3><p class="small">Les informations restent dans le navigateur sur cet appareil. Les mises à jour ne garantissent pas la conservation si le stockage Safari est vidé : exporte régulièrement ton journal.</p><div class="two-actions"><button class="btn secondary" data-action="export">↓ Exporter JSON</button><button class="btn ghost" data-action="import">↑ Importer JSON</button></div><input type="file" id="import-data" accept="application/json,.json" class="hidden"><p class="help">Importer remplace les données de Bloom sur cet appareil. Une confirmation te sera demandée.</p></div>`)}
case 'food': return modalWrap(modal.editId?'Modifier un aliment':'Créer un aliment',`<div class="stack">${field('name','Nom du produit',f.name,'text','maxlength="160" placeholder="Ex. Fromage blanc"')}${field('brand','Marque (facultative)',f.brand,'text','maxlength="120"')}${field('barcode','Code-barres (facultatif)',f.barcode,'text','inputmode="numeric"')}${selects('unit','Valeurs indiquées pour', [['g','100 g'],['ml','100 ml']], f.unit||'g')}<span class="tinylabel">Valeurs pour 100 g / 100 ml</span><div class="form-grid">${field('cal','Calories (kcal)',f.cal,'number','min="0" step="0.1"')}${field('protein','Protéines (g)',f.protein,'number','min="0" step="0.1"')}${field('carbs','Glucides (g)',f.carbs,'number','min="0" step="0.1"')}${field('fat','Lipides (g)',f.fat,'number','min="0" step="0.1"')}${field('fiber','Fibres (g)',f.fiber,'number','min="0" step="0.1"')}${field('sugars','Sucres (g)',f.sugars,'number','min="0" step="0.1"')}</div><button class="btn full" data-action="save-food">Enregistrer cet aliment</button>${modal.editId?`<button class="btn danger full" data-action="delete-food">Supprimer de ma bibliothèque</button>`:''}<p class="help">Les repas déjà enregistrés conserveront leurs valeurs d'origine.</p></div>`);
case 'library':return modalWrap('Mes aliments ❤️',`<div class="stack">${db.foods.length?db.foods.map(f=>`<div class="list-row"><div class="grow"><strong>${esc(f.name)}</strong><small>${esc(f.brand||'')} · ${rnd(f.cal,1)} kcal / 100 ${esc(f.unit||'g')}</small></div><button class="btn tiny secondary" data-action="pick-food" data-id="${esc(f.id)}">Ajouter</button><button class="btn tiny ghost" data-action="edit-food" data-id="${esc(f.id)}">✎</button></div>`).join(''):`<div class="empty">Aucun aliment enregistré pour l'instant.</div>`}<button class="btn secondary full" data-action="new-food">+ Créer un aliment</button></div>`);
case 'meal':{const e=modal.editId?db.entries.find(x=>x.id===modal.editId):null;const src=modal.source||e||{};const form=modal.form||{};const per=nutritionFor(src,num(form.grams,100));return modalWrap(e?'Modifier le repas':'Ajouter au journal',`<div class="stack"><div class="card sage"><strong>${esc(src.name||'Aliment')}</strong><p class="small">${esc(src.brand||'')} · ${rnd(src.cal,1)} kcal pour 100 ${esc(src.unit||'g')}</p></div>${field('grams','Quantité ('+(src.unit||'g')+')',form.grams,'number','min="0.1" step="0.1"')}${selects('type','Catégorie de repas',TYPES.map(t=>[t.id,t.name]),form.type||mealType)}${field('date','Date',form.date||chosenDate,'date')}<div class="card peach"><strong>Aperçu nutritionnel</strong><div class="grid2 mt12">${[['cal','kcal'],['protein','Protéines (g)'],['carbs','Glucides (g)'],['fat','Lipides (g)']].map(([k,l])=>`<div class="statbox"><strong id="preview-${k}">${rnd(per[k],1)}</strong><small>${l}</small></div>`).join('')}</div></div><button class="btn full" data-action="save-meal">${e?'Enregistrer les modifications':'Ajouter ce repas'}</button>${!e?`<button class="btn secondary full" data-action="save-library-from-meal">♡ Enregistrer cet aliment en favori</button>`:''}${e?`<button class="btn secondary full" data-action="duplicate-meal">Copier ce repas vers une autre date</button><button class="btn danger full" data-action="delete-meal">Supprimer ce repas</button>`:''}</div>`)}
case 'copymeal':return modalWrap('Copier ce repas 🌷',`<div class="stack"><p class="small">Une copie indépendante sera créée, tu pourras ensuite la modifier.</p>${field('date','Copier vers le',f.date,'date')}${selects('type','Catégorie de repas',TYPES.map(t=>[t.id,t.name]),f.type)}<button class="btn full" data-action="confirm-copymeal">Copier le repas</button></div>`);
case 'copyday':return modalWrap('Copier une journée 📆',`<div class="stack"><p>Recopier les ${dailyEntries().length} aliments du ${esc(humanDate(chosenDate))} vers une autre date, sans supprimer les repas existants.</p>${field('date','Date de destination',f.date,'date')}<button class="btn full" data-action="confirm-copyday">Copier la journée</button></div>`);

function openModal(type,properties={}){if(modal?.type==='search')resetSearchAsync();stopScanner();modal={type,...properties};render()}

function showFoodEditor(food=null,fromPhoto=false){const form={name:food?.name||'',brand:food?.brand||'',barcode:food?.barcode||'',unit:food?.unit||'g',...cleanNutrition(food||{})};if(fromPhoto&&photoText){const s=photoText;const match=s.match(/^(.{3,70})/m);if(match&&!form.name)form.name=match[1].trim();const patterns={cal:/(?:énergie|energy|calories)[^\d]{0,35}(\d{1,4})(?:\s*kcal)/i,protein:/(?:protéines|proteins?|protein)[^\d]{0,30}(\d+(?:[,.]\d+)?)/i,carbs:/(?:glucides|carbohydrates?|carbs?)[^\d]{0,30}(\d+(?:[,.]\d+)?)/i,fat:/(?:matières grasses|lipides|total fat|fat)[^\d]{0,30}(\d+(?:[,.]\d+)?)/i,fiber:/(?:fibres|fibre|fiber)[^\d]{0,30}(\d+(?:[,.]\d+)?)/i,sugars:/(?:sucres|sugars)[^\d]{0,30}(\d+(?:[,.]\d+)?)/i};for(const [key,regex] of Object.entries(patterns)){const m=s.match(regex);if(m)form[key]=num(m[1])}}openModal('food',{form,editId:food?.id||null});if(fromPhoto)toast('Vérifie les chiffres et la référence 100 g avant d’enregistrer.')}
function showMeal(food,id=null){const entry=id?db.entries.find(x=>x.id===id):null;openModal('meal',{source:{...food},editId:id,form:{grams:entry?.grams||food.defaultGrams||100,type:entry?.type||mealType,date:entry?.date||chosenDate}})}
function startRecipe(id){if(id){const rec=db.recipes.find(x=>x.id===id);if(!rec)return;recipeDraft=JSON.parse(JSON.stringify(rec))}else recipeDraft={id:uid(),name:'',servings:4,cookedWeight:'',ingredients:[]};openModal('recipe',{editId:id||null})}
function searchResultsHTML(){return searchResults.length?searchResults.map((f,i)=>`<div class="list-row"><div class="grow"><strong>${esc(f.name)}</strong><small>${esc(f.brand||'')} · ${f.nutritionKnown?rnd(f.cal,1)+' kcal / 100 '+esc(f.unit||'g'):'Valeurs à vérifier'}</small></div><button class="btn tiny secondary" data-action="pick-result" data-index="${i}">Choisir</button></div>`).join(''):'<p class="small">Saisis un nom ou un code-barres pour commencer.</p>'}
function offProduct(product){const n=product?.nutriments||{};const calories=n['energy-kcal_100g']??(n['energy_100g']!=null?Number(n['energy_100g'])/4.184:null);return {id:uid(),name:String(product.product_name_fr||product.product_name||'Produit sans nom').trim(),brand:String(product.brands||'').slice(0,120),barcode:String(product.code||product._id||''),unit:'g',nutritionKnown:calories!==null&&calories!==undefined,cal:num(calories),protein:num(n.proteins_100g),carbs:num(n.carbohydrates_100g),fat:num(n.fat_100g),fiber:num(n.fiber_100g),sugars:num(n.sugars_100g)}}
function errorLabel(err){if(err?.name==='AbortError')return 'Recherche annulée';const txt=String(err?.message||err);if(/429|rate limit/i.test(txt))return 'Service temporairement limité (trop de recherches). Réessaie plus tard.';if(/Load failed|Failed to fetch|NetworkError|fetch/i.test(txt))return 'Connexion au service impossible depuis Safari (réseau ou autorisation du site).';return txt.slice(0,160)}
function normalizeQuery(q){return String(q||'').trim().replace(/\s+/g,' ').slice(0,80)}
function cachedLocal(q){const v=normalizeQuery(q).toLocaleLowerCase('fr');return db.foods.filter(f=>(f.name+' '+(f.brand||'')).toLocaleLowerCase('fr').includes(v)).slice(0,5).map(f=>({...f,local:true,nutritionKnown:true}))}
function queryTerms(s){return normalizeQuery(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').split(' ').filter(Boolean)}
function foodRelevance(food,q){const terms=queryTerms(q);const name=queryTerms(food.name).join(' '), brand=queryTerms(food.brand||'').join(' ');if(!terms.length)return 0;let score=0;for(const term of terms){if(name===term)score+=130;else if(name.startsWith(term))score+=90;else if(name.includes(' '+term))score+=65;else if(name.includes(term))score+=45;else if(brand.includes(term))score+=18;else return -1}return score+(food.nutritionKnown?4:0)}
function rankFoods(items,q){return items.map((f,i)=>({f,i,s:foodRelevance(f,q)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.f).slice(0,12)}
function cachedForQuery(q){const key=normalizeQuery(q).toLocaleLowerCase('fr');if(searchCache.has(key))return rankFoods(searchCache.get(key),q);let best='';for(const k of searchCache.keys())if(key.startsWith(k)&&k.length>best.length)best=k;return best?rankFoods(searchCache.get(best),q):null}
async function queryClassicSuggest(q,signal){const since=Date.now()-classicSearchLastAt;if(since<7200)throw Error('attente:'+Math.ceil((7200-since)/1000));classicSearchLastAt=Date.now();const endpoint='https://world.openfoodfacts.org/cgi/search.pl?'+new URLSearchParams({search_terms:q,search_simple:'1',action:'process',json:'1',page_size:'24',fields:'code,product_name,product_name_fr,brands,nutriments'}).toString();const resp=await fetch(endpoint,{signal,headers:{'Accept':'application/json'}});if(!resp.ok)throw Error('HTTP '+resp.status);const data=await resp.json();return rankFoods((data.products||[]).filter(p=>p.product_name||p.product_name_fr).map(offProduct),q)}
function searchaliciousHits(data){const hits=Array.isArray(data?.hits)?data.hits:Array.isArray(data?.results)?data.results:[];return hits.map(h=>{let obj=h?._source||h?.source||h?.document||h?.data||h;return obj?.product?obj.product:obj}).filter(v=>v&&typeof v==='object').map(offProduct).filter(f=>f.name!=='Produit sans nom'&&/^\d{8,14}$/.test(f.barcode)).slice(0,12)}
async function querySearchalicious(q,signal){const endpoint='https://search.openfoodfacts.org/search?'+new URLSearchParams({q,langs:'fr,en',page_size:'10',fields:'code,product_name,product_name_fr,brands,nutriments'}).toString();const resp=await fetch(endpoint,{signal,headers:{'Accept':'application/json'}});if(!resp.ok)throw Error('Service de suggestions HTTP '+resp.status);const data=await resp.json();if(data?.errors?.length)throw Error(data.errors[0]?.description||'Erreur de recherche');if(!Array.isArray(data?.hits)&&!Array.isArray(data?.results))throw Error('Réponse de recherche inattendue');return searchaliciousHits(data)}
function updateSuggestions(){const el=$('#search-suggestions'),input=$('#search-query');if(!el||!input||modal?.type!=='search')return;const current=normalizeQuery(input.value);const local=cachedLocal(current);const shown=[...local,...suggestResults.filter(x=>!local.some(y=>(x.barcode&&x.barcode===y.barcode)||(x.name===y.name&&x.brand===y.brand)))].slice(0,9);if(current.length<2||!shown.length){el.hidden=true;el.innerHTML='';input.setAttribute('aria-expanded','false');return}el.innerHTML=`<div class="suggestion-title">${suggestResults.length?'Suggestions de produits':'Mes aliments enregistrés'}</div>`+shown.map((f,i)=>`<button type="button" role="option" class="suggestion-option" data-action="pick-suggestion" data-index="${i}"><span class="suggestion-icon">${f.local?'♡':'🍎'}</span><span class="grow"><strong>${esc(f.name)}</strong><small>${esc(f.brand|| (f.local?'Dans ma bibliothèque':'Open Food Facts'))}${f.nutritionKnown?' · '+rnd(f.cal,1)+' kcal/100 g':''}</small></span><span aria-hidden="true">›</span></button>`).join('');el.hidden=false;el._items=shown;input.setAttribute('aria-expanded','true')}
function resetSearchAsync(){clearTimeout(searchTimer);searchTimer=null;if(searchController){searchController.abort();searchController=null}searchSequence++;suggestResults=[]}
function onSearchTyping(q){
if(modal?.type!=='search')return;
resetSearchAsync();const norm=normalizeQuery(q);if(modal.form)modal.form.query=q;
const status=$('#search-status');if(!status)return;
const cached=cachedForQuery(norm);
if(cached?.length)suggestResults=cached;
updateSuggestions();
if(norm.length<3){status.textContent='Tape au moins 3 lettres pour voir des produits en ligne.';return}
if(/^\d{8,14}$/.test(norm)){status.textContent='Appuie sur Chercher pour trouver ce code-barres.';return}
if(cached?.length){status.textContent='Suggestions disponibles — touche un aliment.';return}
if(!searchWorker()){status.textContent='Suggestions en ligne : configure d’abord le service dans Réglages. La recherche manuelle reste disponible.';return}
status.textContent='Recherche de suggestions…';
const seq=searchSequence;
searchTimer=setTimeout(async()=>{
 if(seq!==searchSequence||modal?.type!=='search')return;
 const controller=new AbortController();searchController=controller;
 const timeout=setTimeout(()=>controller.abort(),9000);
 try{
  const online=await proxyFoods(norm,'suggest',controller.signal);
  if(seq!==searchSequence||modal?.type!=='search')return;
  suggestResults=online;searchCache.set(norm.toLocaleLowerCase('fr'),online);
  if(searchCache.size>70)searchCache.delete(searchCache.keys().next().value);
  updateSuggestions();status.textContent=online.length?'Choisis un aliment parmi les suggestions.':'Aucun aliment trouvé. Essaie une recherche plus précise.';
 }catch(err){
  if(seq!==searchSequence||modal?.type!=='search')return;
  status.textContent=err.name==='AbortError'?'Le service prend trop de temps. Réessaie.':'Recherche en ligne indisponible : '+errorLabel(err);
 }finally{clearTimeout(timeout);if(searchController===controller)searchController=null}
},650);
}
async function findBarcode(code){const el=$('#scan-status')||$('#search-status');if(el)el.textContent='Recherche en cours…';try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_fr,brands,nutriments`,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Requête HTTP '+r.status);const json=await r.json();if(json.status!==1||!json.product)throw Error('Produit absent de la base. Tu peux le créer manuellement.');const food=offProduct(json.product);pendingFood=food;showMeal(food);toast('Produit trouvé ! Vérifie les valeurs sur l’étiquette.');return true}catch(e){if(el)el.textContent=errorLabel(e);toast('Recherche du code-barres impossible.');return false}}
async function selectSearchedProduct(food){resetSearchAsync();if(!food)return;if(food.local){showMeal(food);return}if(food.barcode){const ok=await findBarcode(food.barcode);if(ok)return}if(!food.nutritionKnown){showFoodEditor(food);toast('Valeurs nutritionnelles manquantes : saisis-les depuis l’étiquette.');return}showMeal(food);toast('Données non actualisées : vérifie l’étiquette avant d’enregistrer.')}
async function searchByName(q){
 if(modal?.type!=='search')return;
 const norm=normalizeQuery(q),status=$('#search-status'),results=$('#search-results');
 if(!norm){if(status)status.textContent='Renseigne un nom ou un code-barres.';return}
 resetSearchAsync();updateSuggestions();searchResults=[];
 if(results)results.innerHTML=searchResultsHTML();
 if(/^\d{8,14}$/.test(norm)){await findBarcode(norm);return}
 const local=cachedLocal(norm);
 if(status)status.textContent='Recherche en cours…';
 if(searchWorker()){
  try{
   searchResults=await proxyFoods(norm,'search');
   searchCache.set(norm.toLocaleLowerCase('fr'),searchResults);
   if(status)status.textContent=searchResults.length?searchResults.length+' résultat(s) trouvé(s) — vérifie les valeurs.':'Aucun aliment trouvé. Essaie un autre nom.';
  }catch(err){searchResults=local;if(status)status.textContent='Service en ligne indisponible : '+errorLabel(err)+(local.length?' · Résultats personnels affichés.':' · Tu peux créer cet aliment manuellement.');}
  if(results)results.innerHTML=searchResultsHTML();return;
 }
 // Recherche explicite de secours : pas de recherche automatique à chaque frappe sans passerelle.
 if(local.length){searchResults=local;if(results)results.innerHTML=searchResultsHTML();}
 try{
  const data=await querySearchalicious(norm);
  const found=rankFoods(data,norm);
  if(found.length){searchResults=found;searchCache.set(norm.toLocaleLowerCase('fr'),found);if(status)status.textContent=found.length+' résultat(s) en ligne.';if(results)results.innerHTML=searchResultsHTML();return;}
 }catch(e){}
 if(Date.now()-classicSearchLastAt<7000){if(status)status.textContent='Open Food Facts limite les recherches. Réessaie dans quelques secondes ou configure le service.';return;}
 try{
  searchResults=await queryClassicSuggest(norm);
  if(status)status.textContent=searchResults.length?searchResults.length+' résultat(s) trouvé(s).':'Aucun résultat trouvé.';
 }catch(err){if(status)status.textContent='Connexion directe à Open Food Facts impossible dans Safari. Configure le service dans Réglages pour une recherche fiable.';}
 if(results)results.innerHTML=searchResultsHTML();
}

async function startScanner(){if(!modal||modal.type!=='scan')return;const status=$('#scan-status');if(!navigator.mediaDevices?.getUserMedia){status.textContent='Caméra inaccessible depuis ce navigateur. Essaie Safari en HTTPS.';return}status.textContent='Chargement du lecteur…';try{await loadExternal('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js','Html5Qrcode');if(!modal||modal.type!=='scan')return;scanner=new window.Html5Qrcode('camera-reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:245,height:145}},code=>{const input=$('#barcode');if(input){input.value=code;modal.form.barcode=code}toast('Code détecté : '+code);stopScanner();findBarcode(code)},()=>{});if(status)status.textContent='Présente un code-barres face à la caméra.'}catch(e){if(status)status.textContent='La caméra ne démarre pas : '+(e.message||e)+'. Essaie la saisie manuelle.';stopScanner()}}

async function photoOCR(){const inp=$('#photo-file'),status=$('#ocr-status'),out=$('#ocr-output');const file=inp?.files?.[0];if(!file){toast('Sélectionne une photo ou capture.');return}if(file.size>12*1024*1024){toast('Choisis une image de moins de 12 Mo.');return}status.textContent='Chargement de la reconnaissance de texte… cela peut prendre du temps.';try{await loadExternal('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','Tesseract');status.textContent='Lecture de l’image en cours…';const res=await window.Tesseract.recognize(file,'fra+eng');photoText=String(res.data.text||'');out.value=photoText;status.textContent=photoText.trim()?'Texte détecté. Vérifie avant d’utiliser les valeurs.':'Aucun texte reconnu. Tu peux saisir l’aliment manuellement.'}catch(e){status.textContent='Impossible de lire automatiquement cette image. Tu peux recopier les valeurs à la main.'}}

case 'settings':{const p=db.profile,t=targets(p);openModal('settings',{form:{...p,targetCal:p.targets?.cal??t.cal,targetProtein:p.targets?.protein??t.protein,targetCarbs:p.targets?.carbs??t.carbs,targetFat:p.targets?.fat??t.fat}});return}
case 'save-settings':{const f=modal.form||{};if(!validateProfile(f)){toast('Vérifie tes informations personnelles.');return}db.profile={...db.profile,...f,age:num(f.age),height:num(f.height),weight:num(f.weight),activity:num(f.activity)};delete db.profile.targetCal;delete db.profile.targetProtein;delete db.profile.targetCarbs;delete db.profile.targetFat;save();closeModal();toast('Profil mis à jour 🌷');return}
case 'save-targets':{const f=modal.form||{},vals={cal:num(f.targetCal),protein:num(f.targetProtein),carbs:num(f.targetCarbs),fat:num(f.targetFat)};if(vals.cal<500||vals.cal>8000||vals.protein<0||vals.carbs<0||vals.fat<0){toast('Vérifie les valeurs des objectifs.');return}db.profile.targets=vals;save();closeModal();toast('Objectifs personnalisés enregistrés.');return}
case 'reset-targets':delete db.profile.targets;save();closeModal();toast('Calcul automatique rétabli.');return;
case 'export':exportData();return;
case 'import':$('#import-data')?.click();return;
case 'add-to-meal':mealType=el.dataset.type||'breakfast';view='add';render();toast('Choisis un aliment à ajouter.');return;
case 'edit-entry':{const e=db.entries.find(x=>x.id===el.dataset.id);if(e)showMeal(e,e.id);return}
case 'new-food':showFoodEditor();return;
case 'new-food-for-recipe':openModal('food',{form:{name:'',brand:'',barcode:'',...cleanNutrition({})},fromRecipe:true});return;
case 'edit-food':{const food=db.foods.find(f=>f.id===el.dataset.id);if(food)showFoodEditor(food);return}
case 'save-food':{const f=modal.form||{};if(!String(f.name||'').trim()){toast('Donne un nom à ton aliment.');return}if(valKeys.some(k=>num(f[k])<0)){toast('Les valeurs ne peuvent pas être négatives.');return}const item={id:modal.editId||uid(),name:String(f.name).trim(),brand:String(f.brand||'').trim(),barcode:String(f.barcode||'').trim(),unit:f.unit==='ml'?'ml':'g',...cleanNutrition(f)};if(modal.editId)db.foods=db.foods.map(x=>x.id===modal.editId?item:x);else db.foods.push(item);const fromRecipe=modal.fromRecipe;save();if(fromRecipe)openModal('recipe',{editId:db.recipes.some(r=>r.id===recipeDraft?.id)?recipeDraft.id:null});else closeModal();toast('Aliment enregistré dans ta bibliothèque 🌼');return}
case 'delete-food':{if(!confirm('Supprimer cet aliment de ta bibliothèque ? Les anciens repas resteront inchangés.'))return;db.foods=db.foods.filter(x=>x.id!==modal.editId);save();closeModal();return}
case 'my-foods':openModal('library');return;
case 'pick-food':{const food=db.foods.find(f=>f.id===el.dataset.id);if(food)showMeal(food);return}
case 'pick-result':{const f=searchResults[num(el.dataset.index)];if(f)selectSearchedProduct(f);return}
case 'pick-suggestion':{const list=$('#search-suggestions');const f=list?._items?.[num(el.dataset.index)];if(f)selectSearchedProduct(f);return}
case 'save-library-from-meal':{const f=modal.source;if(!f){return}const exists=db.foods.some(x=>(x.barcode&&x.barcode===f.barcode)||(x.name===f.name&&x.brand===f.brand));if(exists){toast('Cet aliment est déjà dans ta bibliothèque.');return}db.foods.push({...f,id:uid()});save();toast('Ajouté à ta bibliothèque ❤️');return}
case 'save-meal':{const f=modal.form||{},src=modal.source;if(!src)return;const grams=num(f.grams),date=f.date,type=f.type;if(!(grams>0&&grams<=99999)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!TYPES.some(t=>t.id===type)){toast('Vérifie la quantité, la date et le type de repas.');return}const entry={...cleanNutrition(src),name:String(src.name||'Aliment'),brand:String(src.brand||''),unit:src.unit||'g',sourceId:src.id||null,id:modal.editId||uid(),date,type,grams};if(modal.editId){db.entries=db.entries.map(x=>x.id===modal.editId?entry:x)}else db.entries.push(entry);chosenDate=date;save();closeModal();view='journal';render();toast('Repas enregistré 🌷');return}
case 'delete-meal':if(confirm('Supprimer cet aliment du journal ?')){db.entries=db.entries.filter(x=>x.id!==modal.editId);save();closeModal();toast('Aliment supprimé.')}return;
case 'duplicate-meal':{const origin=db.entries.find(x=>x.id===modal.editId);if(!origin)return;openModal('copymeal',{originId:origin.id,form:{date:addDays(origin.date,1),type:origin.type}});return}
case 'confirm-copymeal':{const origin=db.entries.find(x=>x.id===modal.originId),f=modal.form;if(!origin||!/^\d{4}-\d{2}-\d{2}$/.test(f.date))return toast('Date incorrecte.');db.entries.push({...origin,id:uid(),date:f.date,type:f.type});chosenDate=f.date;save();closeModal();view='journal';render();toast('Repas copié.');return}
case 'copy-day':openModal('copyday',{form:{date:addDays(chosenDate,1)}});return;
case 'confirm-copyday':{const arr=dailyEntries(),date=modal.form.date;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date===chosenDate){toast('Choisis une autre date.');return}for(const e of arr)db.entries.push({...e,id:uid(),date});chosenDate=date;save();closeModal();view='journal';render();toast(`${arr.length} aliment(s) copiés.`);return}
case 'steps':openModal('steps',{form:{steps:db.steps[chosenDate]??0}});return;
case 'save-steps':{const n=num(modal.form.steps);if(!Number.isInteger(n)||n<0||n>150000){toast('Nombre de pas incorrect.');return}db.steps[chosenDate]=n;save();closeModal();return}
case 'weight':openModal('weight',{form:{date:chosenDate,weight:db.weights.find(w=>w.date===chosenDate)?.weight??db.profile.weight}});return;
case 'save-weight':{const f=modal.form,n=num(f.weight);if(n<25||n>400||!/^\d{4}-\d{2}-\d{2}$/.test(f.date)){toast('Vérifie le poids et la date.');return}db.weights=db.weights.filter(w=>w.date!==f.date);db.weights.push({id:uid(),date:f.date,weight:n});save();closeModal();toast('Pesée enregistrée 🌱');return}
case 'show-search':resetSearchAsync();searchResults=[];openModal('search',{form:{query:''}});return;
case 'run-search':searchByName($('#search-query')?.value||'');return;
case 'connect-search-service':{
 const value=String($('#search-worker-url')?.value||'').trim().replace(/\/+$/,'');
 if(value&&!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(value)){toast('Utilise une adresse HTTPS se terminant par workers.dev');return}
 db.settings=db.settings||{};db.settings.searchWorkerUrl=value;save();
 const label=$('#search-worker-status');if(label)label.textContent=value?'Adresse enregistrée. Appuie sur Tester la connexion.':'Service désactivé. Les aliments locaux restent accessibles.';
 toast('Configuration enregistrée 🌷');return;
}
case 'check-search-service':{
 const label=$('#search-worker-status'),base=searchWorker();if(!base){if(label)label.textContent='Renseigne et enregistre d’abord une adresse workers.dev.';return}
 if(label)label.textContent='Vérification du service…';
 fetch(base+'/health',{headers:{'Accept':'application/json'},signal:AbortSignal.timeout(8000)}).then(async r=>{const j=await r.json();if(!r.ok||j.status!=='ok')throw Error('Service non opérationnel');if(label)label.textContent='✅ Service connecté. La recherche automatique peut être essayée.'}).catch(e=>{if(label)label.textContent='❌ Connexion impossible : '+errorLabel(e)});return;
}
case 'show-scan':openModal('scan',{form:{barcode:''}});return;
case 'start-scan':startScanner();return;
case 'stop-scan':stopScanner();if($('#scan-status'))$('#scan-status').textContent='Caméra arrêtée.';return;
case 'lookup-barcode':{const code=String($('#barcode')?.value||'').trim();if(!/^\d{8,14}$/.test(code)){toast('Entre un code-barres de 8 à 14 chiffres.');return}findBarcode(code);return}
case 'show-photo':photoText='';openModal('photo');return;
case 'read-photo':photoOCR();return;
case 'photo-to-food':photoText=$('#ocr-output')?.value||photoText;showFoodEditor(null,true);return;
case 'new-recipe':startRecipe();return;
case 'edit-recipe':startRecipe(el.dataset.id);return;
case 'recipe-add-ingredient':openModal('ingredient',{form:{foodId:db.foods[0]?.id||'',grams:100}});return;
case 'confirm-ingredient':{const f=modal.form,food=db.foods.find(x=>x.id===f.foodId),grams=num(f.grams);if(!food||grams<=0||grams>99999){toast('Sélectionne un aliment et une quantité valide.');return}recipeDraft.ingredients.push({...cleanNutrition(food),name:food.name,brand:food.brand,grams});openModal('recipe',{editId:db.recipes.some(r=>r.id===recipeDraft.id)?recipeDraft.id:null});return}
case 'recipe-remove-ingredient':recipeDraft.ingredients.splice(num(el.dataset.index),1);openModal('recipe',{editId:db.recipes.some(r=>r.id===recipeDraft.id)?recipeDraft.id:null});return;
case 'save-recipe':{const r=recipeDraft;if(!r?.name?.trim()||r.ingredients.length===0||!Number.isInteger(num(r.servings))||num(r.servings)<1||num(r.servings)>1000||num(r.cookedWeight)<0){toast('Nom, portions et au moins un ingrédient sont nécessaires.');return}r.servings=num(r.servings);r.cookedWeight=num(r.cookedWeight);if(!db.recipes.some(x=>x.id===r.id))db.recipes.push(JSON.parse(JSON.stringify(r)));else db.recipes=db.recipes.map(x=>x.id===r.id?JSON.parse(JSON.stringify(r)):x);save();closeModal();toast('Recette enregistrée 🥣');return}
case 'delete-recipe':{if(!confirm('Supprimer cette recette ? Les repas déjà ajoutés restent conservés.'))return;db.recipes=db.recipes.filter(x=>x.id!==recipeDraft.id);save();closeModal();return}
case 'use-recipe':{const r=db.recipes.find(x=>x.id===el.dataset.id);if(r){mealType='lunch';showMeal({...calcRecipe(r),id:r.id},null)}return}
}}
function bind(){document.addEventListener('click',ev=>{if(ev.target?.matches('[data-backdrop="1"]')){closeModal();return}const go=ev.target.closest('[data-go]');if(go){stopScanner();view=go.dataset.go;modal=null;render();window.scrollTo(0,0);return}const ch=ev.target.closest('[data-profile-choice]');if(ch){const key=ch.dataset.profileChoice;draftProfile[key]=key==='activity'?num(ch.dataset.value):ch.dataset.value;render();return}const btn=ev.target.closest('[data-action]');if(btn){ev.preventDefault();doAction(btn.dataset.action,btn)}});
document.addEventListener('input',ev=>{const target=ev.target;if(target.id==='search-query'){onSearchTyping(target.value);return}const prop=target.dataset.profile;if(prop){draftProfile[prop]=target.value;return}const key=target.dataset.form;if(key){if(modal?.type==='recipe'){recipeDraft[key]=target.value}else if(modal){modal.form=modal.form||{};modal.form[key]=target.value;if(modal.type==='meal'&&key==='grams'){const n=nutritionFor(modal.source,num(target.value));for(const k of ['cal','protein','carbs','fat']){const el=$(`#preview-${k}`);if(el)el.textContent=rnd(n[k],1)}}}return}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='day'){if(t.value){chosenDate=t.value;render()}return}if(t.id==='import-data'&&t.files?.[0]){importData(t.files[0]);return}if(t.id==='photo-file'){const im=t.files?.[0];const host=$('#photo-preview');if(im&&host){const url=URL.createObjectURL(im);host.innerHTML='<img class="photo-preview" alt="Photo choisie">';host.querySelector('img').src=url;host.querySelector('img').onload=()=>URL.revokeObjectURL(url)}return}if(t.dataset.form){if(modal?.type==='recipe')recipeDraft[t.dataset.form]=t.value;else if(modal){modal.form=modal.form||{};modal.form[t.dataset.form]=t.value}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal?.type==='search'){const el=$('#search-suggestions');if(el)el.hidden=true;return}if(ev.key==='Enter'&&ev.target.id==='search-query'){ev.preventDefault();searchByName(ev.target.value)}});
window.addEventListener('pagehide',()=>{if(scanner)stopScanner()});}
// Remplacer la cible calculée par les éventuelles préférences enregistrées.
const calculateTargets=targets;
targets=function(profile){const automatic=calculateTargets(profile);if(profile?.targets){const custom=profile.targets;return {...automatic,cal:num(custom.cal,automatic.cal),protein:num(custom.protein,automatic.protein),carbs:num(custom.carbs,automatic.carbs),fat:num(custom.fat,automatic.fat)}}return automatic};
bind();render();
